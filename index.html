
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bear Ninja Hunter JavaScript Game">
    <title>Bear Ninja Hunter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            color: darkgreen;
        }

        #gameResult {
            background-color: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Bear Ninja Hunter</h1>
    <p id="gameResult"></p>

    <script>
        // Ask the player for their name
        let playerName = prompt("Welcome to Bear Ninja Hunter! Please enter your name:");

        // Greet the player
        alert("Hi " + playerName + " Let's Play!!");

        // Ask the player to choose Bear, Ninja, or Hunter
        let playerChoice = prompt("Who are you: Bear, Ninja, or Hunter?");

        // Computer choice stays Bear for Part 2
        let computerChoice = "Bear";

        // This variable stores the game outcome
        let gameWinner = "";

        // Check the computer's choice using switch
        switch (computerChoice) {

            case "Bear":
                // Compare the player's choice against Bear
                if (playerChoice === "Bear") {
                    gameWinner = "It's a Tie!!";
                }
                else if (playerChoice === "Hunter") {
                    gameWinner = "You Win!!";
                }
                else {
                    gameWinner = "Computer Wins!!";
                }
                break;

            case "Ninja":
                // Compare the player's choice against Ninja
                if (playerChoice === "Ninja") {
                    gameWinner = "It's a Tie!!";
                }
                else if (playerChoice === "Bear") {
                    gameWinner = "You Win!!";
                }
                else {
                    gameWinner = "Computer Wins!!";
                }
                break;

            case "Hunter":
                // Compare the player's choice against Hunter
                if (playerChoice === "Hunter") {
                    gameWinner = "It's a Tie!!";
                }
                else if (playerChoice === "Ninja") {
                    gameWinner = "You Win!!";
                }
                else {
                    gameWinner = "Computer Wins!!";
                }
                break;
        }

        // Build the personalized result with concatenation
        let gameMessage = playerName + " chose " + playerChoice +
            ", computer chose " + computerChoice +
            ", " + gameWinner;

        // Show the result in the browser console
        console.log(gameMessage);

        // Show the same result on the HTML page
        document.getElementById("gameResult").textContent = gameMessage;

    </script>

</body>
</html>
